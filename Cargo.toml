[workspace]
members = [
  "crates/honestqr-core",
  "crates/honestqr-http",
  "crates/honestqr-server",
  "crates/honestqr-cli",
  "crates/honestqr-lambda",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Mizaro/honestqrcode-api"
homepage = "https://honestqrcode.com/"
authors = ["Mizaro"]

[workspace.dependencies]
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
hex = "0.4.3"
http = "1.3.1"
http-body-util = "0.1.3"
image = { version = "0.25.8", default-features = false, features = ["png"] }
lambda_http = "1.3.0"
prometheus-client = "0.25.0"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.2", features = ["limit", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "cors", "limit", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = "2.5.7"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
