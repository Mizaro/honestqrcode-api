[package]
name = "honestqr-stress"
description = "HTTP stress harness for Honest QR Code API capacity testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "honestqr-stress"
path = "src/main.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
honestqr-http = { version = "0.1.1", path = "../honestqr-http" }
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "sync"] }

[dev-dependencies]
honestqr-http = { version = "0.1.1", path = "../honestqr-http" }
