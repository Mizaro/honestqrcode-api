apiVersion: apps/v1
kind: Deployment
metadata:
  name: honestqrcode-api
  labels:
    app.kubernetes.io/name: honestqrcode-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: honestqrcode-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: honestqrcode-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mizaro/honestqrcode-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HONESTQR_JSON_LOGS
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: honestqrcode-api
spec:
  selector:
    app.kubernetes.io/name: honestqrcode-api
  ports:
    - name: http
      port: 80
      targetPort: http

